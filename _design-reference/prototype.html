<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas Finance — Prototype (toutes les pages)</title>
<!-- Arial is a system font, no need to import -->
<link rel="stylesheet" href="app.css?v=2">
<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="screens/shared.jsx"></script>
<script type="text/babel" src="screens/dashboards.jsx"></script>
<script type="text/babel" src="screens/workflow.jsx"></script>
<script type="text/babel" src="screens/intelligence.jsx"></script>

<script type="text/babel">
const W = 1440, H = 900;

// Wrap each screen at 1440×900 for consistent artboard size
const Frame = ({ children }) => (
  <div style={{ width: W, height: H, overflow: "hidden", background: "#0A1628", color: "#F2EDE4" }}>
    {children}
  </div>
);

function Prototype() {
  return (
    <DesignCanvas>
      <DCSection id="auth" title="Authentification" subtitle="Point d'entrée — 3 rôles, sécurisé JWT + Argon2">
        <DCArtboard id="login" label="01 · Connexion" width={W} height={H}>
          <Frame><LoginScreen/></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="dashboards" title="Tableaux de bord" subtitle="Une vue par rôle — Admin, Gestionnaire, Comptable">
        <DCArtboard id="dash-admin" label="02 · Dashboard Administrateur" width={W} height={H}>
          <Frame><DashboardAdmin/></Frame>
        </DCArtboard>
        <DCArtboard id="dash-gest" label="03 · Dashboard Gestionnaire" width={W} height={H}>
          <Frame><DashboardGestionnaire/></Frame>
        </DCArtboard>
        <DCArtboard id="dash-compt" label="04 · Dashboard Comptable" width={W} height={H}>
          <Frame><DashboardComptable/></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="workflow" title="Workflow budgétaire" subtitle="Création → Soumission → Validation → Suivi">
        <DCArtboard id="budget-create" label="05 · Création de budget" width={W} height={H}>
          <Frame><BudgetCreation/></Frame>
        </DCArtboard>
        <DCArtboard id="validation" label="06 · Validation détail" width={W} height={H}>
          <Frame><ValidationDetail/></Frame>
        </DCArtboard>
        <DCArtboard id="expenses" label="07 · Suivi des dépenses" width={W} height={H}>
          <Frame><ExpenseTracking/></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="intelligence" title="Intelligence & analytique" subtitle="IA Claude, KPIs consolidés">
        <DCArtboard id="ia" label="08 · Assistant IA Claude" width={W} height={H}>
          <Frame><ChatbotIA/></Frame>
        </DCArtboard>
        <DCArtboard id="kpi" label="09 · KPI Analytics" width={W} height={H}>
          <Frame><KPIAnalytics/></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="governance" title="Gouvernance & administration" subtitle="Audit immuable, accès, paramètres">
        <DCArtboard id="audit" label="10 · Journal d'audit" width={W} height={H}>
          <Frame><AuditLog/></Frame>
        </DCArtboard>
        <DCArtboard id="users" label="11 · Utilisateurs" width={W} height={H}>
          <Frame><UsersPage/></Frame>
        </DCArtboard>
        <DCArtboard id="settings" label="12 · Paramètres" width={W} height={H}>
          <Frame><SettingsPage/></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="marketing" title="Site public" subtitle="Landing — référence">
        <DCArtboard id="landing" label="13 · Landing page" width={W} height={H}>
          <iframe src="index.html" style={{ width: W, height: H, border: 0, display: "block" }} title="Landing"/>
        </DCArtboard>
      </DCSection>

      <DCPostIt top={120} left={40} rotate={-3}>
        13 écrans · cliquez sur l'icône ⤢ pour zoomer · ←/→ pour naviguer
      </DCPostIt>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Prototype/>);
</script>
</body>
</html>
