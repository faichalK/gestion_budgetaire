<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas Finance — Écrans complémentaires</title>
<link rel="stylesheet" href="app.css?v=2">
<style>html, body, #root { margin: 0; padding: 0; height: 100%; background: #f0eee9; }</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="screens/shared.jsx"></script>
<script type="text/babel" src="screens/missing.jsx"></script>

<script type="text/babel">
const W = 1440, H = 900;
const Frame = ({ children }) => <div style={{ width: W, height: H, overflow: "hidden", background: "#0A1628", color: "#F2EDE4" }}>{children}</div>;

function Proto() {
  return (
    <DesignCanvas>
      <DCSection id="budgets" title="Budgets" subtitle="Liste consolidée + page détail (vue gestionnaire)">
        <DCArtboard id="budget-list"   label="14 · Budgets — Liste"    width={W} height={H}><Frame><BudgetList/></Frame></DCArtboard>
        <DCArtboard id="budget-detail" label="15 · Budget — Détail"    width={W} height={H}><Frame><BudgetDetail/></Frame></DCArtboard>
      </DCSection>
      <DCSection id="depenses" title="Dépenses" subtitle="Détail d'une dépense soumise au comptable">
        <DCArtboard id="exp-detail"    label="16 · Dépense — Détail"   width={W} height={H}><Frame><ExpenseDetail/></Frame></DCArtboard>
      </DCSection>
      <DCSection id="rapports" title="Rapports" subtitle="Vue croisée Budget × Dépense">
        <DCArtboard id="reports"       label="17 · Rapports combinés"  width={W} height={H}><Frame><RapportsCombines/></Frame></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Proto/>);
</script>
</body>
</html>
